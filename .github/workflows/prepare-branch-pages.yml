name: Prepare branch-hosted neuron index
on:
  push:
    branches: [master]
    paths: [.github/workflows/prepare-branch-pages.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Generate static neuron index
        run: python3 scripts/build_drone_index.py
      - name: Validate index against the actual connectome
        run: node --test experiments/drone/tests/real-data.test.cjs
      - name: Commit generated data to the publishing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- data/drone-index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Include generated neuron index for branch-based Pages hosting"
          git push origin HEAD:master
